<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCore Dashboard</title>
    <link rel="stylesheet" href="css/site.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #1e1410;
            color: #f7f4f2; 
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #2b1c16; 
            padding: 15px 40px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #3d2a21;
        }

            nav button {
                background: none;
                border: none;
                font-size: 16px;
                font-weight: 600;
                color: #a79288; 
                cursor: pointer;
                padding: 8px 16px;
                transition: all 0.2s ease;
                border-radius: 8px;
            }

                nav button:hover, nav button.active {
                    color: #fdd8c5; 
                    background-color: #3d2a21;
                }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            color: #fdd8c5;
        }

        .subtitle {
            color: #a79288;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .back-btn {
            background-color: #2b1c16;
            color: #f7f4f2;
            border: 1px solid #3d2a21;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 25px;
        }

            .back-btn:hover {
                background-color: #3d2a21;
            }

        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .category-row-card {
            background: #4a2f25;
            color: #f7f4f2;
            border-radius: 14px;
            padding: 24px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

            .category-row-card:hover {
                background: #5c3c30;
                transform: translateX(4px);
            }

        .category-arrow {
            color: #a79288;
        }

        .workouts-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .workout-row-card {
            background: #2b1c16;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #3d2a21;
        }

            .workout-row-card:hover {
                background: #3d2a21;
            }

        .workout-img-placeholder {
            width: 55px;
            height: 55px;
            background: #e6ccbe; 
            border-radius: 10px;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .workout-main-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            font-weight: 600;
        }

        .workout-sub-data {
            margin: 0;
            color: #a79288;
            font-size: 14px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            background: #2b1c16;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #3d2a21;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            background: #d7ccc8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #4a2f25;
        }

        .profile-title h2 {
            margin: 0 0 4px 0;
            font-size: 22px;
        }

        .profile-title p {
            margin: 0;
            color: #a79288;
            font-size: 14px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }

        .stat-card {
            flex: 1;
            background: #2b1c16;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #3d2a21;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #fdd8c5;
        }

        .stat-label {
            font-size: 11px;
            color: #a79288;
            margin-top: 4px;
        }

        .workout-hero {
            background: #2b1c16;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid #3d2a21;
            position: relative;
        }

        .favorite-toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }

            .favorite-toggle-btn:hover {
                transform: scale(1.1);
            }

            .favorite-toggle-btn svg {
                width: 26px;
                height: 26px;
                fill: none;
                stroke: #a79288;
                stroke-width: 2;
                transition: fill 0.2s, stroke 0.2s;
            }

            .favorite-toggle-btn.is-fav svg {
                fill: #fdd8c5;
                stroke: #fdd8c5;
            }

        .start-btn {
            background: #e6ccbe; 
            color: #4a2f25;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 22px;
            cursor: pointer;
            margin-top: 20px;
        }

            .start-btn:hover {
                background: #f5e1d5;
            }

        .exercise-row {
            background: #2b1c16;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #3d2a21;
            cursor: pointer;
        }

            .exercise-row:hover {
                background: #3d2a21;
            }

        .exercise-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .exercise-num {
            width: 26px;
            height: 26px;
            background: #3d2a21;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #a79288;
        }

        .exercise-info-container {
            background: #2b1c16;
            border-radius: 16px;
            padding: 35px;
            border: 1px solid #3d2a21;
        }

        .exercise-visual-placeholder {
            width: 100%;
            height: 220px;
            background: #f5e1d5;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .instruction-card {
            background: #3d2a21;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <button id="nav-cat" class="active" onclick="navigateTo('categories')">Discover</button>
        <button id="nav-prof" onclick="navigateTo('profile')">Profile</button>
    </nav>

    <div class="container">

        <div id="categories-section" class="app-page">
            <h1>Browse by category</h1>
            <p id="counter" class="subtitle"></p>
            <div id="categories" class="categories-list"></div>
        </div>

        <div id="workouts-section" class="app-page" style="display: none;">
            <button class="back-btn" onclick="backToCategories()">← Categories</button>
            <h1 id="workouts-title">Workouts</h1>
            <p id="workouts-counter" class="subtitle"></p>
            <div id="workouts" class="workouts-list"></div>
        </div>

        <div id="workout-details-section" class="app-page" style="display: none;">
            <button class="back-btn" onclick="backToWorkouts()">← Back</button>

            <div class="workout-hero">
                <button id="fav-heart-btn" class="favorite-toggle-btn" onclick="toggleFavorite()">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                </button>
                <h1 id="selected-workout-name">Workout</h1>
                <p id="info-workout-subdata" style="color: #a79288; margin: 10px 0 0 0; font-size: 15px;"></p>
                <button class="start-btn" onclick="startFirstExercise()">Start Workout</button>
            </div>

            <h3 style="margin: 25px 0 15px 0;">Exercises</h3>
            <div id="exercises-list"></div>
        </div>

        <div id="exercise-page-section" class="app-page" style="display: none;">
            <button class="back-btn" onclick="backToWorkoutDetails()">← Back to Workout</button>

            <div class="exercise-info-container">
                <div class="exercise-visual-placeholder"></div>
                <h1 id="exercise-title" style="margin: 0 0 10px 0;">Exercise Name</h1>

                <div class="instruction-card">
                    <h4 style="margin: 0 0 8px 0; color: #fdd8c5; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px;">How to perform:</h4>
                    <p id="exercise-desc" style="margin: 0; color: #f7f4f2; line-height: 1.6; font-size: 15px;"></p>
                </div>
            </div>
        </div>

        <div id="profile-section" class="app-page" style="display: none;">
            <h1>My Profile</h1>
            <p class="subtitle">Your fitness achievements</p>

            <div class="profile-header">
                <div class="profile-avatar">KF</div>
                <div class="profile-title">
                    <h2 id="user-nickname">User</h2>
                    <p id="user-email">email@knu.ua</p>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value">320</div>
                    <div class="stat-label">KCAL BURNED</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="fav-count">0</div>
                    <div class="stat-label">FAVORITES</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">45 min</div>
                    <div class="stat-label">TOTAL TIME</div>
                </div>
            </div>

            <h3 style="margin-bottom: 15px;">My Favorites</h3>
            <div id="user-workouts-list" class="workouts-list"></div>
        </div>

    </div>

    <script src="js/lab2.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getCategories();
        getUserProfile();
    </script>
</body>
</html>
